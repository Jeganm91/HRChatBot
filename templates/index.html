<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Assistant</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg-1: #0f1029;
    --bg-2: #1b1440;
    --accent-1: #7c3aed;
    --accent-2: #ec4899;
    --accent-grad: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
    --card-bg: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --text-main: #f4f2ff;
    --text-dim: #b9b3d9;
    --bubble-user: linear-gradient(135deg, #7c3aed, #a855f7);
    --bubble-bot: rgba(255, 255, 255, 0.08);
    --success: #22c55e;
    --danger: #f43f5e;
    --radius: 18px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #2a1f5e 0%, var(--bg-1) 45%),
                radial-gradient(circle at 90% 80%, #3a1450 0%, var(--bg-2) 55%);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    padding: 28px 16px;
  }

  .shell {
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 4px 2px;
  }

  .brand .logo {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: var(--accent-grad);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 8px 24px rgba(124, 58, 237, 0.45);
    flex-shrink: 0;
  }

  .brand h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .brand p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .controls-row {
    display: flex;
    gap: 10px;
    padding: 0 2px;
  }

  .controls-row select {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
  }
  .controls-row select:focus { border-color: var(--accent-1); }

  .chat-window {
    height: 460px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .chat-window::-webkit-scrollbar { width: 8px; }
  .chat-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 8px; }

  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 88%;
    animation: fadeIn 0.35s ease;
  }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .avatar.bot { background: var(--accent-grad); }
  .avatar.user { background: rgba(255,255,255,0.14); }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg-row.bot .bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--card-border);
    border-bottom-left-radius: 4px;
  }

  .sources {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .source-pill {
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(124, 58, 237, 0.22);
    border: 1px solid rgba(124, 58, 237, 0.4);
    color: #ddd0ff;
  }

  .input-bar {
    display: flex;
    gap: 10px;
    padding: 14px;
  }

  .input-bar input {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    border-radius: 999px;
    padding: 13px 18px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .input-bar input:focus { border-color: var(--accent-1); }
  .input-bar input::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--accent-grad);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(124, 58, 237, 0.4);
    transition: transform 0.12s ease;
    flex-shrink: 0;
  }
  .send-btn:hover { transform: scale(1.06); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 600px) {
    .chat-window { height: calc(100vh - 340px); }
    .controls-row { flex-direction: column; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/>
        </svg>
      </div>
      <div>
        <h1>HR Assistant</h1>
        <p>Leave, payroll, onboarding &amp; policy Q&amp;A</p>
      </div>
    </div>

    <div class="controls-row">
      <select id="roleSelect">
        <option value="Employee">Role: Employee</option>
        <option value="Contractor">Role: Contractor</option>
        <option value="Manager">Role: Manager</option>
      </select>
    </div>

    <div class="card">
      <div class="chat-window" id="chatWindow">
        <div class="msg-row bot">
          <div class="avatar bot">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/>
            </svg>
          </div>
          <div class="bubble">Hi! Ask me about leave, payroll, onboarding, holidays or policies.</div>
        </div>
      </div>
      <div class="input-bar">
        <input type="text" id="messageInput" placeholder="Ask an HR question…" />
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

<script>
let sessionId = null;

const chatWindow = document.getElementById("chatWindow");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const roleSelect = document.getElementById("roleSelect");

const ICON_BOT = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>`;
const ICON_USER = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>`;

function scrollToBottom() {
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function addUserMessage(text) {
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `<div class="avatar user">${ICON_USER}</div><div class="bubble"></div>`;
  row.querySelector(".bubble").textContent = text;
  chatWindow.appendChild(row);
  scrollToBottom();
}

function addTypingIndicator() {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.id = "typingRow";
  row.innerHTML = `<div class="avatar bot">${ICON_BOT}</div><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  chatWindow.appendChild(row);
  scrollToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById("typingRow");
  if (el) el.remove();
}

function addBotMessage(text, sources) {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  const sourcesHtml = (sources && sources.length)
    ? `<div class="sources">${sources.map(s => `<span class="source-pill">${s}</span>`).join("")}</div>`
    : "";
  row.innerHTML = `
    <div class="avatar bot">${ICON_BOT}</div>
    <div class="bubble">
      <div class="reply-text"></div>
      ${sourcesHtml}
    </div>`;
  row.querySelector(".reply-text").textContent = text;
  chatWindow.appendChild(row);
  scrollToBottom();
}

async function sendMessage(text) {
  if (!text.trim()) return;
  addUserMessage(text);
  messageInput.value = "";
  sendBtn.disabled = true;
  addTypingIndicator();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        user_role: roleSelect.value,
        session_id: sessionId,
      }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    removeTypingIndicator();
    addBotMessage(data.reply, data.sources);
  } catch (err) {
    removeTypingIndicator();
    addBotMessage("Request failed: " + err.message, []);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", () => sendMessage(messageInput.value));
messageInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage(messageInput.value);
});
</script>
</body>
</html>
